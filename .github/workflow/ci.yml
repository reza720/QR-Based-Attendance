name: CI

on: 
  push:
    branches: 
      - master
  pull_request:   
    branches:
      - master

jobs: 
  # Linting
  Linting:
    name: Linting
    runs-on: ubuntu-latest
    steps: 
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with: 
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      
      - name: install dependencies
        working-directory: server
        run: npm ci   # fixed

      - name: run eslint
        working-directory: server
        run: npm run lint

  # Formatting
  Formatting: 
    name: Formatting
    runs-on: ubuntu-latest
    steps: 
      - name: checkout code
        uses: actions/checkout@v4
      
      - name: setup node
        uses: actions/setup-node@v4   
        with: 
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: install dependencies
        working-directory: server   
        run: npm ci
    
      - name: check format
        working-directory: server
        run: npm run format:check
